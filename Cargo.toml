[package]
name = "deeplens"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DeepLens"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
global-hotkey = "0.7"
iced = { version = "0.14", features = ["tokio", "image"] }
libc = "0.2"
objc = "0.2"
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
